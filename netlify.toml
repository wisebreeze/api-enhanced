[build]
  # No build step needed: the edge function is a single self-contained
  # Deno/TS file with no dependencies (uses Web standard fetch + Headers).
  command = ""
  edge_functions = "netlify/edge-functions"

[build.environment]
  NODE_VERSION = "22"

# Route every path through the edge function. Edge Functions use
# [[edge_functions]] declarations instead of [[redirects]] — the
# function receives the original request with path + query intact.
[[edge_functions]]
  function = "api"
  path = "/*"
